version: '3.8'

services:

  # CKAN application
  ckan:
    image: ckan/ckan-base:2.11.3
    container_name: ckan_app
    environment:
      # Database
      CKAN_SQLALCHEMY_URL: postgresql://kong:kong@192.168.88.100:5431/ckan_default?sslmode=disable
      CKAN_DATASTORE_WRITE_URL: postgresql://kong:kong@192.168.88.100:5431/datastore_default?sslmode=disable
      CKAN_DATASTORE_READ_URL: postgresql://ckan:ckan@192.168.88.100:5431/datastore_default?sslmode=disable
      
      # Redis
      # CKAN_REDIS_URL: redis://192.168.88.100:9379/0
      CKAN_REDIS_URL: redis://192.168.88.100:9379/0
      
      # Solr
      CKAN_SOLR_URL: http://192.168.88.90:8983/solr/ckan
      
      # Site settings
      CKAN_SITE_URL: https://open-data.smartcity-cloud.org
      CKAN_SITE_ID: default
      
      # Plugins
      CKAN__PLUGINS: "image_view text_view datatables_view datastore envvars datarequests stats harvest ckan_harvester"

      CKAN__LOCALE_DEFAULT: vi
      
      # Harvest Configuration
      CKAN__HARVEST__MQ__TYPE: redis
      CKAN__HARVEST__MQ__HOSTNAME: 192.168.88.100
      CKAN__HARVEST__MQ__PORT: 9379
      CKAN__HARVEST__MQ__REDIS_DB: 0
      CKAN__HARVEST__LOG_LEVEL: info
      CKAN__HARVEST__LOG_TIMEFRAME: 30
      CKAN__HARVEST__STATUS_MAIL__ERRORED: false
      CKAN__HARVEST__TIMEOUT: 1440
      
      # Storage
      CKAN_STORAGE_PATH: /var/lib/ckan
      
      # Security
      CKAN___BEAKER__SESSION__SECRET: "your-secret-key-here"
      CKAN__API_TOKEN__JWT__ENCODE__SECRET: "your-jwt-secret-here"
      CKAN__API_TOKEN__JWT__DECODE__SECRET: "your-jwt-secret-here"
      
      # Performance Optimization
      UWSGI_HARAKIRI: 300
      UWSGI_WORKERS: 4
      UWSGI_BUFFER_SIZE: 32768
      UWSGI_MAX_REQUESTS: 1000
      UWSGI_MAX_WORKER_LIFETIME: 3600
      UWSGI_CHEAPER: 2
      UWSGI_CHEAPER_INITIAL: 2
      UWSGI_CHEAPER_OVERLOAD: 30
      
      # Python Optimization  
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONOPTIMIZE: 1
      
      # CKAN Performance
      CKAN___BEAKER__SESSION__TYPE: database
      CKAN___BEAKER__SESSION__DATA_DIR: /tmp/sessions/data
      CKAN___BEAKER__SESSION__LOCK_DIR: /tmp/sessions/lock
      CKAN___BEAKER__SESSION__TIMEOUT: 3600
      CKAN__SEARCH__SHOW_ALL_TYPES: false
      CKAN__CACHE__ENABLED: true
      CKAN__CACHE__CONFIG: "dogpile.cache.redis"
      CKAN__CACHE__ARGUMENTS__HOST: "192.168.88.100"
      CKAN__CACHE__ARGUMENTS__PORT: 9379
      CKAN__CACHE__ARGUMENTS__DB: 2
      
      # Template Caching
      CKAN__TEMPLATE_CACHE_ENABLED: true
      
      # SMTP (optional - for email notifications)
      CKAN_SMTP_SERVER: smtp.gmail.com
      CKAN_SMTP_STARTTLS: True
      CKAN_SMTP_USER: ioc.spnt@gmail.com
      CKAN_SMTP_PASSWORD: yxhv lkce lcrk apgb
      CKAN_SMTP_MAIL_FROM: ioc.spnt@gmail.com
      
    volumes:
      # Mount storage and logs to host filesystem for easy access
      - ./data/ckan_storage:/var/lib/ckan
      - ./data/ckan_logs:/var/log/ckan
      # Mount setup scripts for quick testing without rebuild
      - ./ckan-2.11/setup/harvest_run_wrapper.sh:/srv/app/harvest_run_wrapper.sh:ro
      - ./ckan-2.11/setup/harvest_cleanup_wrapper.sh:/srv/app/harvest_cleanup_wrapper.sh:ro
      - ./ckan-2.11/setup/ckan_harvester_cron.sh:/srv/app/ckan_harvester_cron.sh:ro
      - ./ckan-2.11/setup/start_ckan_production.sh:/srv/app/start_ckan_production.sh:ro
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/3/action/status_show || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # # DataPusher (optional - for CSV data processing)
  # datapusher:
