; ===============================
; CKAN Harvester Supervisor Config
; ===============================
; This config file runs the harvest gather and fetch consumers
; as background processes managed by Supervisor

[program:ckan_gather_consumer]
command=/usr/local/bin/ckan --config=/srv/app/ckan.ini harvester gather-consumer
user=ckan
numprocs=1
stdout_logfile=/var/log/ckan/gather_consumer.log
stderr_logfile=/var/log/ckan/gather_consumer.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60

[program:ckan_fetch_consumer]
command=/usr/local/bin/ckan --config=/srv/app/ckan.ini harvester fetch-consumer
user=ckan
numprocs=1
stdout_logfile=/var/log/ckan/fetch_consumer.log
stderr_logfile=/var/log/ckan/fetch_consumer.log
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=60

[group:ckan_harvester]
programs=ckan_gather_consumer,ckan_fetch_consumer
priority=999